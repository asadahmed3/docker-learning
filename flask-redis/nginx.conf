# Define the Flask backends NGINX can forward requests to.
# "web" is the Compose service name; 5000 is Flask's internal port.
# At startup, NGINX resolves this name to the running web containers.
upstream flask_backend {
    server web:5000;
}

server {
    # Listen on port 80 inside the NGINX container.
    # Compose forwards your Mac's port 5002 to this port.
    listen 80;

    # Match paths beginning with "/", including the welcome page and /count.
    location / {
        # Forward the request to the Flask upstream group.
        # NGINX distributes requests across its resolved backends.
        # Flask handles the route and communicates with Redis.
        proxy_pass http://flask_backend;
    }
}