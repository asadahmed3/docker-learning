
services:

  web:
    environment:
      REDIS_HOST: "redis"
      
    build: .
    depends_on:
      - redis
      
  redis:
    build: ./redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  loadbalancer:
    image: nginx:alpine 
    ports:
      - "5002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    

volumes:
  redis-data:
    