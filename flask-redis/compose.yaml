# Compose creates a default network for these services.
# Services can find each other by name, such as "redis" and "web".
services:

  web:
    environment:
      # app.py reads this hostname to locate the Redis service.
      # REDIS_PORT is omitted, so the code uses its fallback of 6379.
      REDIS_HOST: "redis"

    # Build the Flask image using the main project's Dockerfile.
    # This folder is also the build context for COPY instructions.
    build: .

    # Start Redis before Flask. This does not guarantee Redis is ready.
    depends_on:
      - redis

    # No host port is published here: NGINX reaches Flask internally
    # on port 5000, allowing multiple Flask containers without port conflicts.

  redis:
    # Build using the Dockerfile in the redis subfolder.
    build: ./redis

    volumes:
      # Store Redis's /data files in a Docker-managed named volume.
      # The volume survives container removal unless explicitly deleted.
      - redis-data:/data

    # Enable AOF persistence, which records changes to data files.
    # Redis writes the files; the volume above retains them.
    command: redis-server --appendonly yes

  loadbalancer:
    # Use the existing NGINX image directly instead of building one.
    image: nginx:alpine

    ports:
      # Left = port on your Mac; right = port inside NGINX's container.
      # Browser requests to localhost:5002 reach NGINX on port 80.
      - "5002:80"

    volumes:
      # Bind-mount our local configuration over NGINX's default config.
      # "ro" allows NGINX to read the file without modifying it.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    # Start the web service before NGINX.
    # nginx.conf defines how requests are forwarded to Flask.
    depends_on:
      - web

# Declare the named volume used by Redis above.
# This declaration creates storage; the service mapping attaches it.
volumes:
  redis-data: